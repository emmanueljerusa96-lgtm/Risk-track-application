name: Build Risk Track Demo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Mock Data APK
        run: flutter build apk --release

      - name: Upload Risk Track APK
        uses: actions/upload-artifact@v4
        with:
          name: risk-track-demo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
